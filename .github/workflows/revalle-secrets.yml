name: RevSign - checagem de segredos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'
  # Commit do Documenso v2.21.1 em que a branch revalle começou. Com --first-parent
  # só os commits próprios são varridos, então este valor não muda nas atualizações.
  REVALLE_BASE_SHA: '8707e33c124e4b1a68dde92d5e05178c9aabd0be'

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$file" -C "$HOME/.local/bin" gitleaks
          rm -f "$file" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Checar segredos
        run: sh scripts/revalle/check-secrets.sh --range "$REVALLE_BASE_SHA"
