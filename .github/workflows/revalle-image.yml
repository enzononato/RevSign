name: RevSign - imagem Docker

# Tag vX.Y.Z-revalle.N => ghcr.io/enzononato/revsign:vX.Y.Z-revalle.N (+ sha-<curto>).
# Manual (workflow_dispatch) => só sha-<curto>, para testes.
# O job backup publica igualmente ghcr.io/enzononato/revsign-backup (testes rodam antes do push).
# Nunca publica "latest": a VPS sempre fixa a versão.

on:
  push:
    tags:
      - 'v*-revalle.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/enzononato/revsign
  BACKUP_IMAGE: ghcr.io/enzononato/revsign-backup

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # O build do monorepo ocupa muito disco; o runner padrão vem com ~14 GB livres.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Definir tags
        id: tags
        run: |
          set -eu
          short_sha="$(git rev-parse --short=8 HEAD)"
          tags="${IMAGE}:sha-${short_sha}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${IMAGE}:${GITHUB_REF_NAME},${tags}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Mês da base DB-IP Lite (o Dockerfile cai para o mês anterior se ainda não existir).
      - name: Mês da base GeoIP
        id: geoip
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build carregado no daemon local (sem push): a imagem é conferida antes de publicar.
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          build-args: DBIP_MONTH=${{ steps.geoip.outputs.month }}
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: revsign:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # REVALLE: a base DB-IP (geolocalização por IP) precisa estar na imagem e não vazia. O Dockerfile nunca falha
      # por ela (build local sem internet segue); a publicação, sim. Falhou: o db-ip.com não respondeu, rode de novo.
      - name: Conferir base GeoIP na imagem
        run: |
          set -eu
          cid="$(docker create revsign:ci)"
          docker cp "$cid:/app/geoip/dbip-city-lite.mmdb" ./geoip-check.mmdb || true
          docker rm "$cid" > /dev/null
          if ! test -s ./geoip-check.mmdb; then
            echo "::error::Base DB-IP ausente ou vazia na imagem (/app/geoip/dbip-city-lite.mmdb). O download do db-ip.com falhou no build; rode o workflow de novo mais tarde."
            exit 1
          fi
          ls -l ./geoip-check.mmdb
          rm -f ./geoip-check.mmdb

      # REVALLE: o catálogo pt-BR compilado na imagem tem de trazer frases que só existem no overlay
      # (packages/lib/translations/revalle/pt-BR.po). Sem o overlay, o build passa e a imagem mostraria "Documenso".
      - name: Conferir overlay pt-BR na imagem
        run: sh scripts/revalle/check-image-i18n.sh revsign:ci

      # Publica exatamente a imagem conferida (sem rebuild).
      - name: Publicar imagem
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -eu
          for t in $(echo "$TAGS" | tr ',' ' '); do
            docker tag revsign:ci "$t"
            docker push "$t"
          done

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Definir tags
        id: tags
        run: |
          set -eu
          short_sha="$(git rev-parse --short=8 HEAD)"
          tags="${BACKUP_IMAGE}:sha-${short_sha}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${BACKUP_IMAGE}:${GITHUB_REF_NAME},${tags}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Imagem de teste carregada no daemon local (sem push).
      - name: Build da imagem de teste
        uses: docker/build-push-action@v6
        with:
          context: revalle/backup
          platforms: linux/amd64
          load: true
          push: false
          tags: revsign-backup:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Testes da imagem de backup
        run: sh revalle/backup/test/run-tests.sh

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publica exatamente a imagem testada (sem rebuild).
      - name: Publicar imagem testada
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -eu
          for t in $(echo "$TAGS" | tr ',' ' '); do
            docker tag revsign-backup:test "$t"
            docker push "$t"
          done
