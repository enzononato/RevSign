# RevSign — ensaio local de homologação (WSL + Docker Desktop).
#
# Espelha o que vai no EasyPanel: Postgres dedicado + app da imagem do GHCR,
# certificado por variável base64 (sem arquivo montado, porque não há SSH na VPS).
# O Mailpit substitui o SMTP do cPanel e captura os e-mails em http://localhost:8025.
#
# Uso (segredos ficam FORA do repositório):
#   docker compose -f revalle/deploy/compose.hml.yml --env-file ../local-hml/hml.env up -d
#
# Modelo do arquivo de variáveis: revalle/deploy/env.hml.example

name: revsign-hml

services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: documenso
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documenso -d documenso']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql/data
    # Sem "ports": o banco não fica acessível fora da rede do compose.

  # Base FICTÍCIA de colaboradores (só a view vw_colaboradores_assinatura é legível
  # pelo usuário revsign_leitura). Em produção, troque pela base real via
  # COLABORADORES_DATABASE_URL. O app NÃO depende dela para subir.
  colaboradores-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COLABORADORES_ADMIN_PASSWORD:-dev-admin-colaboradores}
      POSTGRES_DB: colaboradores
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d colaboradores']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ../colaboradores/dev-seed.sql:/docker-entrypoint-initdb.d/dev-seed.sql:ro
    # Sem "ports".

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:8025:8025'

  documenso:
    image: ${REVSIGN_IMAGE:-ghcr.io/enzononato/revsign:v2.21.1-revalle.6}
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 3000
      # A imagem do upstream não define NODE_ENV. Sem "production", o tRPC devolve
      # stack trace nas respostas de erro.
      NODE_ENV: production
      TZ: America/Bahia
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?err}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${NEXT_PRIVATE_ENCRYPTION_KEY:?err}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY:?err}
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL:-http://localhost:3000}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgres://documenso:${POSTGRES_PASSWORD}@database:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://documenso:${POSTGRES_PASSWORD}@database:5432/documenso
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_JOBS_PROVIDER: local
      NEXT_PUBLIC_DISABLE_SIGNUP: ${NEXT_PUBLIC_DISABLE_SIGNUP:-false}
      # Cadastro e (na Fase 3) signatários só destes domínios. Vazio = qualquer domínio.
      NEXT_PRIVATE_ALLOWED_SIGNUP_DOMAINS: ${NEXT_PRIVATE_ALLOWED_SIGNUP_DOMAINS:-revalle.com.br,revallenordeste.com.br,revallepe.com.br}
      # Usuário promovido a ADMIN na subida, se já cadastrado.
      NEXT_PRIVATE_REVALLE_ADMIN_EMAIL: ${NEXT_PRIVATE_REVALLE_ADMIN_EMAIL:-projetos.ti@revalle.com.br}
      # required (padrão) confere CPF + data de nascimento na base; disabled pula a etapa (só homologação sem a base).
      NEXT_PRIVATE_REVALLE_IDENTITY_CHECK: ${NEXT_PRIVATE_REVALLE_IDENTITY_CHECK:-required}
      # Selagem ICP-Brasil (política AD-RB + DocMDP P=2). "false" volta à selagem do upstream (ver certificado.md).
      NEXT_PRIVATE_REVALLE_ICP_SEAL: ${NEXT_PRIVATE_REVALLE_ICP_SEAL:-true}
      # Dicionário da assinatura: etsi (Adobe.PPKLite / ETSI.CAdES.detached) ou pbad (PBAD_PAdES / PBAD.PAdES).
      NEXT_PRIVATE_REVALLE_ICP_PDF_DICT: ${NEXT_PRIVATE_REVALLE_ICP_PDF_DICT:-etsi}
      # Hash da política no atributo assinado: policy (ETSI, o que o arquivo da política traz) ou lpa (SHA-256 do arquivo).
      NEXT_PRIVATE_REVALLE_ICP_POLICY_HASH: ${NEXT_PRIVATE_REVALLE_ICP_POLICY_HASH:-policy}
      COLABORADORES_DATABASE_URL: ${COLABORADORES_DATABASE_URL:-postgres://revsign_leitura:revsign_leitura_dev@colaboradores-db:5432/colaboradores}
      DOCUMENSO_DISABLE_TELEMETRY: 'true'
      NEXT_PUBLIC_REVALLE_SOURCE_URL: https://github.com/enzononato/RevSign
      # SMTP: Mailpit no ensaio; no EasyPanel, o SMTP do cPanel (ver env.hml.example).
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: ${NEXT_PRIVATE_SMTP_HOST:-mailpit}
      NEXT_PRIVATE_SMTP_PORT: ${NEXT_PRIVATE_SMTP_PORT:-1025}
      NEXT_PRIVATE_SMTP_USERNAME: ${NEXT_PRIVATE_SMTP_USERNAME:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${NEXT_PRIVATE_SMTP_PASSWORD:-}
      NEXT_PRIVATE_SMTP_SECURE: ${NEXT_PRIVATE_SMTP_SECURE:-false}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${NEXT_PRIVATE_SMTP_FROM_NAME:-Revalle Assinaturas}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${NEXT_PRIVATE_SMTP_FROM_ADDRESS:-assinaturas@revalle.com.br}
      # Certificado .p12 em base64 (com senha obrigatória).
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS: ${NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS:?err}
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${NEXT_PRIVATE_SIGNING_PASSPHRASE:?err}
    ports:
      - '127.0.0.1:3000:3000'

  # Backup diário cifrado (age) do Postgres, com cópia SFTP/FTPS e retenção.
  # Sem BACKUP_AGE_RECIPIENT o serviço não sobe (nunca envia dump em texto puro).
  backup:
    image: ${REVSIGN_BACKUP_IMAGE:-ghcr.io/enzononato/revsign-backup:v2.21.1-revalle.6}
    depends_on:
      database:
        condition: service_healthy
    environment:
      TZ: America/Bahia
      BACKUP_DATABASE_URL: postgres://documenso:${POSTGRES_PASSWORD}@database:5432/documenso
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?defina BACKUP_AGE_RECIPIENT (chave pública age1...)}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_REMOTE_TYPE: ${BACKUP_REMOTE_TYPE:-none}
      BACKUP_REMOTE_HOST: ${BACKUP_REMOTE_HOST:-}
      BACKUP_REMOTE_PORT: ${BACKUP_REMOTE_PORT:-}
      BACKUP_REMOTE_USER: ${BACKUP_REMOTE_USER:-}
      BACKUP_REMOTE_PASSWORD: ${BACKUP_REMOTE_PASSWORD:-}
      BACKUP_REMOTE_PATH: ${BACKUP_REMOTE_PATH:-revsign-backups}
      # Opcional (SFTP): known_hosts montado no container; ver env.hml.example.
      BACKUP_REMOTE_KNOWN_HOSTS_FILE: ${BACKUP_REMOTE_KNOWN_HOSTS_FILE:-}
    volumes:
      - backups:/backups

volumes:
  database:
  backups:
